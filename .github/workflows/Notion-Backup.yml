name: Notion Backup
on: workflow_dispatch
jobs:
backup:
- name: Backup Notion
    run: |
      npm install -g @notionhq/client
      node -e "
      const { Client } = require('@notionhq/client');
      const fs = require('fs');
      const client = new Client({ auth: process.env.NOTION_TOKEN });
      async function main() {
        const res = await client.search({});
        fs.writeFileSync('notion-backup.json', JSON.stringify(res, null, 2));
      }
      main();
      "
      - name: Upload backup
    uses: actions/upload-artifact@v4
    with:
      name: notion-backup
      path: notion-backup.json
      retention-days: 90
 
